name: GymBro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gymbro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: V2 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the lockfile-pinned browser and system dependencies
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Check syntax and canonical release metadata
        run: |
          npm run check:syntax
          npm run check:release
      - name: Check committed range and working-tree whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:diff
      - name: Run the complete regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/tests.log
      - name: Retain test output even when tests fail
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  postgres:
    name: V3 PostgreSQL isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          GYMBRO_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
