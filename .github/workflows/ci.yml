name: GymBro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gymbro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Disposable database replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create disposable local Postgres and apply migrations
        run: |
          npm run db:local:start
          npm run db:local:apply
          npm run db:local:test
          node scripts/exercise-identity-db-fixture.cjs
          npx --no-install supabase test db --local test-results/exercise-identity-migration.test.sql
          node scripts/workout-repository-db-fixture.cjs
          npx --no-install supabase test db --local test-results/workout-repository.test.sql
          node scripts/workout-concurrency-db-fixture.cjs
          npx --no-install supabase test db --local test-results/workout-concurrency.test.sql
          node scripts/workout-concurrency-races.cjs --local
          node scripts/workout-lifecycle-db-fixture.cjs
          npx --no-install supabase test db --local test-results/workout-lifecycle.test.sql
          node scripts/workout-lifecycle-races.cjs --local
          node scripts/workout-migration-races.cjs --local
          node scripts/workout-migration-db-fixture.cjs
          npx --no-install supabase test db --local test-results/workout-migration.test.sql
          node scripts/verify-cutover-schema.cjs capture
      - name: Replay from empty local database and verify retry
        run: |
          npx --no-install supabase db reset --local --version 20261028042000 --no-seed
          node scripts/workout-concurrency-upgrade.cjs before
          npm run db:local:apply
          node scripts/workout-concurrency-upgrade.cjs after
          npm run db:local:test
          npx --no-install supabase test db --local test-results/exercise-identity-migration.test.sql
          npx --no-install supabase test db --local test-results/workout-repository.test.sql
          npm run db:local:apply
          npx --no-install supabase test db --local test-results/workout-concurrency.test.sql
          npx --no-install supabase test db --local test-results/workout-lifecycle.test.sql
          npx --no-install supabase test db --local test-results/workout-migration.test.sql
          npx --no-install supabase db query --local --file supabase/verify-infrastructure.sql
          node scripts/verify-cutover-schema.cjs compare
      - name: Retain database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop only this job's disposable stack
        if: always()
        run: npx --no-install supabase stop --no-backup
  regression:
    name: V2 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the lockfile-pinned browser and system dependencies
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Check syntax and canonical release metadata
        run: |
          npm run check:syntax
          npm run check:release
      - name: Check committed range and working-tree whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:diff
      - name: Run the complete regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/tests.log
      - name: Retain test output even when tests fail
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
