name: GymBro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gymbro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: V2 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tested revision and comparison history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the lockfile-pinned browser and system dependencies
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Check syntax and canonical release metadata
        run: |
          npm run check:syntax
          npm run check:release
      - name: Check committed range and working-tree whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:diff
      - name: Run the complete regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/tests.log
      - name: Retain test output even when tests fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
