# Local disposable stack only. Never run config push against a hosted project.
project_id = "gymbro-infrastructure"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
enable_anonymous_sign_ins = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
